# docker-compose.yml
# --------------------
# Runs the FastAPI backend and Streamlit dashboard as two containers from
# the same image, sharing the same .env configuration.
#
# Usage:
#   docker compose up --build
#
# Then open:
#   API docs:  http://localhost:8000/docs
#   Dashboard: http://localhost:8501

services:
  api:
    build: .
    container_name: bi-assistant-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  dashboard:
    build: .
    container_name: bi-assistant-dashboard
    command: ["streamlit", "run", "streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
